name: Export verified POS Servis APK to chat
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Retrieve verified signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download latest -R "${GITHUB_REPOSITORY}" --pattern POS-Servis-AKTUALIZACE.apk
          gh release download latest -R "${GITHUB_REPOSITORY}" --pattern PUBLIC-SHA256SUMS.txt
          sha256sum -c PUBLIC-SHA256SUMS.txt
          echo "d589ce6f91f4a93e7ae01898cfb25c0e13898a48ba09e5ef21061321c29681de  POS-Servis-AKTUALIZACE.apk" | sha256sum -c -
      - name: Export original signed APK
        uses: actions/upload-artifact@v4
        with:
          name: POS-Servis-0.21.1.213-ORIGINAL-APK
          path: POS-Servis-AKTUALIZACE.apk
          retention-days: 1
