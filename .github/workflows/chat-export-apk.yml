name: Export signed POS Servis APK to chat
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Download official signed Android APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download latest -R "${GITHUB_REPOSITORY}" --pattern POS-Servis-AKTUALIZACE.apk
          echo "196d2542c96698d7cecb0c67dc9c316bcc61b10ab7c7ba79d007fd213508fa75  POS-Servis-AKTUALIZACE.apk" | sha256sum -c -
      - name: Publish as artifact
        uses: actions/upload-artifact@v4
        with:
          name: POS-Servis-0.21.1.175-ORIGINAL-APK
          path: POS-Servis-AKTUALIZACE.apk
          retention-days: 1
