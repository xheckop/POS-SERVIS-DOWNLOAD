name: Export signed POS Servis APK to chat
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Download original verified Android APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download latest -R "${GITHUB_REPOSITORY}" --pattern POS-Servis-AKTUALIZACE.apk
          gh release download latest -R "${GITHUB_REPOSITORY}" --pattern PUBLIC-SHA256SUMS.txt
          sha256sum -c PUBLIC-SHA256SUMS.txt
          echo "0ee5cf6eadf927cbb6b77eb7edab064c815cbc485829e15f5adb683251a44396  POS-Servis-AKTUALIZACE.apk" | sha256sum -c -
      - name: Publish original signed APK for ChatGPT attachment
        uses: actions/upload-artifact@v4
        with:
          name: POS-Servis-0.21.1.187-ORIGINAL-APK
          path: POS-Servis-AKTUALIZACE.apk
          retention-days: 1
